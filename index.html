        --fg: #0f172a;
        --mu: #5b6478;

      --mu: #5b6478;
      --glass: rgba(255, 255, 255, .7);
      --bd: rgba(15, 23, 42, .1);
      --ac1: #4f46e5;
      --ac2: #0891b2;

    html {

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;

    .mono {

    .mu {
      color: var(--mu)
    }

    .ac {
      color: var(--ac1)
    }

    .glass {

      border: 1px solid var(--bd);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 1rem

      position: relative;
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1)
    }

    .glow:hover {
      transform: translateY(-6px)
    }

    .glow::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;

      opacity: 0;
      transition: opacity .3s;
      pointer-events: none

    .glow:hover::before {
      opacity: 1

      color: var(--fg);

    .btn-p {

      border-color: transparent

    .pill {

      border-radius: 999px;
      font-size: .85rem;
      font-weight: 500;
      border: 1px solid var(--bd);
      background: var(--glass);
      color: var(--mu);
      cursor: pointer;
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), color .2s
    }

    .pill:hover {
      color: var(--fg)
    }

    .pill:active {
      transform: scale(.92)
    }

    .pill.on {
      background: linear-gradient(90deg, var(--ac1), var(--ac2));
      color: var(--on);
      border-color: transparent
    }

    .chip {
      display: inline-block;
      font-size: .72rem;
      padding: .2rem .6rem;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: var(--glass);
      color: var(--ac1)

    .grad {
      background: linear-gradient(90deg, var(--ac1), var(--ac2), var(--ac1));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shift 6s linear infinite
    }

    @keyframes shift {
      to {
        background-position: 200% center
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes slide {
      from {
        transform: translateX(100%)
      }

      to {
        transform: none
      }
    }

    @keyframes pulse2 {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, .6)
      }

      50% {
        box-shadow: 0 0 0 6px rgba(52, 211, 153, 0)
      }
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .fade {
      animation: fade .4s both
    }

    .drawer {
      animation: slide .35s cubic-bezier(.22, 1, .36, 1) both

    .live {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: #34d399;
      animation: pulse2 1.8s infinite
    }

    .cur {
      display: inline-block;
      width: .5ch;
      animation: blink 1s step-end infinite
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, .65);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 60

    .field {

      background: var(--glass);
      color: var(--fg);
      border: 1px solid var(--bd);
      border-radius: .7rem;
      padding: .65rem .85rem;

    .field:focus {

    .field.bad {

    }

    .tile {

    .tile:hover,
    .tile.on {

    function useTyped(words) {
      const [t, setT] = useState('');
      useEffect(() => {
        let i = 0, j = 0, del = false, id;
        const tick = () => {
          const w = words[i];
          setT(w.slice(0, j));
          if (!del && j === w.length) { del = true; id = setTimeout(tick, 1400); return; }
          if (del && j === 0) { del = false; i = (i + 1) % words.length; }
          j += del ? -1 : 1;
          id = setTimeout(tick, del ? 35 : 75);
        };
        tick();
        return () => clearTimeout(id);
      }, []);
      return t;
    }

      const pick = t => { setTab(t); setAct(SKILLS[t][0]); };
      return (
        <Sec id="skills" kicker="// toolbox" title="Skills matrix">
          <div className="flex flex-wrap gap-2 mb-6">
            {tabs.map(t => <button key={t} className={'pill' + (tab === t ? ' on' : '')} onClick={() => pick(t)}>{t}</button>)}
          </div>
          <div className="grid gap-5 lg:grid-cols-5">
            <div className="lg:col-span-3 grid grid-cols-2 sm:grid-cols-3 gap-3" key={tab}>
              {SKILLS[tab].map(s => (
                <button key={s[0]} className={'glass tile fade p-4 text-left' + (act[0] === s[0] ? ' on' : '')}
                  onMouseEnter={() => setAct(s)} onClick={() => setAct(s)}>
                  <p className="font-bold">{s[0]}</p><p className="mu text-xs mt-1">{s[2]}</p>
                </button>
              ))}
            </div>
            <div className="lg:col-span-2 glass p-6" aria-live="polite">
              <p className="mono ac text-xs uppercase tracking-widest">How I use it</p>
              <h3 className="text-2xl font-extrabold mt-2">{act[0]}</h3>
              <p className="mu mt-3">{act[1]}</p>
              <p className="mt-4 text-xs mu">Used in: <span className="text-[color:var(--fg)]">{act[2]}</span></p>
            </div>
          </div>
        </Sec>
      );
    }

    function Terminal() {
      const [lines, setLines] = useState([{ k: 'out', s: 'Type a command or tap a chip below. Try "experience".' }]);
      const [val, setVal] = useState('');
      const body = useRef(null);
      useEffect(() => { if (body.current) body.current.scrollTop = body.current.scrollHeight; }, [lines]);
      const run = raw => {
        const c = raw.trim().toLowerCase();
        if (!c) return;
        if (c === 'clear') { setLines([]); return; }
        const res = OUT[c] || [`command not found: ${c}. Type help.`];
        setLines(l => [...l, { k: 'cmd', s: c }, ...res.map(s => ({ k: 'out', s }))]);
      };
      return (
        <Sec id="experience" kicker="// experience & education" title="Interactive terminal">
          <div className="term fade overflow-hidden">
            <div className="flex items-center gap-2 px-4 py-2.5" style={{ borderBottom: '1px solid rgba(255,255,255,.1)' }}>
              <span className="w-3 h-3 rounded-full bg-red-400/80" /><span className="w-3 h-3 rounded-full bg-yellow-400/80" /><span className="w-3 h-3 rounded-full bg-emerald-400/80" />
              <span className="mono text-xs ml-2 opacity-60">pavithran@portfolio:~</span>
            </div>
            <div ref={body} className="mono text-[13px] leading-relaxed p-4 h-72 overflow-y-auto">
              {lines.map((l, i) => (
                <div key={i} className="whitespace-pre-wrap break-words" style={{ color: l.k === 'cmd' ? '#22d3ee' : undefined }}>
                  {l.k === 'cmd' ? '$ ' + l.s : l.s}
                </div>
              ))}
              <form className="flex items-center gap-2 mt-1" onSubmit={e => { e.preventDefault(); run(val); setVal(''); }}>
                <span style={{ color: '#22d3ee' }}>$</span>
                <input value={val} onChange={e => setVal(e.target.value)} aria-label="Terminal command" autoComplete="off" spellCheck="false"
                  className="flex-1 bg-transparent outline-none mono text-[13px]" placeholder="type a command" />
              </form>
            </div>
            <div className="flex flex-wrap gap-2 px-4 py-3" style={{ borderTop: '1px solid rgba(255,255,255,.1)' }}>
              {['help', 'whoami', 'experience', 'education', 'projects', 'skills', 'certs', 'contact', 'clear'].map(c => (
                <button key={c} className="pill mono !text-xs !py-1" style={{ background: 'transparent', color: '#c9d4ea' }} onClick={() => run(c)}>{c}</button>
              ))}
            </div>
          </div>
        </Sec>
      );
    }

    function Drawer({ onClose }) {
      const [f, setF] = useState({ name: '', email: '', msg: '' });
      const [touched, setTouched] = useState(false);
      const [status, setStatus] = useState('idle');
      useEffect(() => {
        const k = e => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', k);
        return () => window.removeEventListener('keydown', k);
      }, []);
      const err = useMemo(() => ({
        name: f.name.trim().length < 2 ? 'Please enter your name.' : '',
        email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email) ? '' : 'Enter a valid email address.',
        msg: f.msg.trim().length < 10 ? 'Message should be at least 10 characters.' : '',
      }), [f]);
      const valid = !err.name && !err.email && !err.msg;
      const submit = e => {
        e.preventDefault(); setTouched(true);
        if (!valid) return;
        setStatus('sending');
        setTimeout(() => {
          setStatus('sent');
          const body = encodeURIComponent(`${f.msg}\n\n${f.name} (${f.email})`);
          window.location.href = `mailto:${EMAIL}?subject=${encodeURIComponent('Portfolio message from ' + f.name)}&body=${body}`;
        }, 900);
      };
      const Fld = ({ k, label, area }) => (
        <label className="block">
          <span className="text-sm mu">{label}</span>
          {area ? <textarea rows="4" className={'field mt-1' + (touched && err[k] ? ' bad' : '')} value={f[k]} onChange={e => setF({ ...f, [k]: e.target.value })} />
            : <input className={'field mt-1' + (touched && err[k] ? ' bad' : '')} value={f[k]} onChange={e => setF({ ...f, [k]: e.target.value })} />}
          {touched && err[k] && <span className="text-xs text-red-400">{err[k]}</span>}
        </label>
      );
      return (
        <div className="ov !p-0 !place-items-stretch justify-items-end" onClick={onClose} role="dialog" aria-modal="true" aria-label="Contact">
          <div className="drawer h-full w-full max-w-md p-6 overflow-y-auto" style={{ background: 'var(--bg)', borderLeft: '1px solid var(--bd)' }} onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="text-2xl font-extrabold">Get in touch</h3>
              <button onClick={onClose} aria-label="Close" className="mu"><Icon n="x" s={22} /></button>
            </div>
            {status === 'sent' ? (
              <div className="text-center py-16 fade">
                <div className="mx-auto w-16 h-16 rounded-full grid place-items-center bg-emerald-400/15 text-emerald-400"><Icon n="check" s={32} /></div>
                <h4 className="text-xl font-bold mt-5">Message ready!</h4>
                <p className="mu mt-2 text-sm">Your email app is opening with the message filled in. Press send there to deliver it.</p>
                <button className="btn mt-6" onClick={() => { setStatus('idle'); setTouched(false); setF({ name: '', email: '', msg: '' }); }}>Write another</button>
              </div>
            ) : (
              <form onSubmit={submit} noValidate className="space-y-4 mt-5">
                <p className="mu text-sm">Open to full-stack and Graduate Engineer Trainee roles. Tell me what you have in mind.</p>
                <Fld k="name" label="Name" /><Fld k="email" label="Your email" /><Fld k="msg" label="Message" area />
                <button type="submit" className="btn btn-p w-full justify-center" disabled={status === 'sending'}>
                  <Icon n="send" s={16} /> {status === 'sending' ? 'Sending...' : 'Send message'}
                </button>
              </form>
            )}
            <div className="mt-8 pt-5 flex flex-wrap gap-2" style={{ borderTop: '1px solid var(--bd)' }}>
              <CopyEmail />
              <a className="btn" href={GH} target="_blank" rel="noreferrer"><Icon n="github" s={16} /></a>
              <a className="btn" href={LI} target="_blank" rel="noreferrer"><Icon n="linkedin" s={16} /></a>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [drawer, setDrawer] = useState(false);
      const [theme, setTheme] = useState('dark');
      const typed = useTyped(['Full-stack developer', 'Spring Boot + React', 'Flask + Firebase apps', 'Open to SDE trainee roles']);
      useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
      return (
        <div>
          <header className="sticky z-40" style={{ top: 'env(safe-area-inset-top, 0px)', background: 'color-mix(in srgb, var(--bg) 70%, transparent)', backdropFilter: 'blur(14px)', borderBottom: '1px solid var(--bd)' }}>
            <nav className="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between">
              <a href="#top" className="font-extrabold mono">pavithran<span className="ac">.dev</span></a>
              <div className="flex items-center gap-4 text-sm mu">
                <a className="hidden sm:inline hover:text-[color:var(--fg)]" href="#projects">Projects</a>
                <a className="hidden sm:inline hover:text-[color:var(--fg)]" href="#skills">Skills</a>
                <a className="hidden sm:inline hover:text-[color:var(--fg)]" href="#experience">Experience</a>
                <button className="mu" aria-label="Toggle theme" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}><Icon n={theme === 'dark' ? 'sun' : 'moon'} s={18} /></button>
                <button className="btn btn-p !py-1.5 !px-3" onClick={() => setDrawer(true)}>Contact</button>
              </div>
            </nav>
          </header>

          <main id="top">
            <div className="max-w-6xl mx-auto px-5 pt-20 pb-10">
              <span className="glass inline-flex items-center gap-2 px-3 py-1.5 text-xs font-medium"><span className="live" /> Available for new roles</span>
              <h1 className="text-5xl sm:text-7xl font-extrabold tracking-tight mt-6">Hi, I'm <span className="grad">Pavithran K</span></h1>
              <p className="mono text-lg sm:text-2xl mt-4 h-8">&gt; {typed}<span className="cur ac">|</span></p>
              <p className="mu mt-5 max-w-2xl text-lg">B.E. CSE student who builds software end to end, from the database to the screen a user sees, with Java, Spring Boot, React, Python and Flask.</p>
              <div className="mt-8 flex flex-wrap gap-3">
                <a href="#projects" className="btn btn-p">Explore projects <Icon n="arrow" s={16} /></a>
                <a href={RESUME} target="_blank" rel="noreferrer" className="btn"><Icon n="file" s={16} /> View resume</a>
                <button className="btn" onClick={() => setDrawer(true)}><Icon n="mail" s={16} /> Get in touch</button>
              </div>
              <div className="mt-6 flex gap-2">
                <a className="btn !p-2.5" href={GH} target="_blank" rel="noreferrer" aria-label="GitHub"><Icon n="github" s={18} /></a>
                <a className="btn !p-2.5" href={LI} target="_blank" rel="noreferrer" aria-label="LinkedIn"><Icon n="linkedin" s={18} /></a>
                <a className="btn !p-2.5" href={`mailto:${EMAIL}`} aria-label="Email"><Icon n="mail" s={18} /></a>
                <CopyEmail className="!py-2" />
              </div>
              <div className="mt-12 grid grid-cols-1 sm:grid-cols-3 gap-4">
                {[['3', 'full-stack projects'], ['Mar\u2013Jun 2025', 'full-stack internship'], ['7.41 CGPA', 'B.E. CSE, 2023\u20132027']].map(([a, b]) => (
                  <Glow key={b} className="p-5"><p className="text-2xl font-extrabold">{a}</p><p className="mu text-sm">{b}</p></Glow>
                ))}
              </div>
            </div>
            <Projects />
            <Skills />
            <Terminal />
          </main>
          <footer className="mu text-center text-sm pb-12 mono">built with React + Tailwind | Pavithran K</footer>
          {drawer && <Drawer onClose={() => setDrawer(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
