<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#4f46e5;--acs:#eef2ff;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#131a2e;--fg:#e8ecf6;--mu:#94a3b8;--bd:#243049;--ac:#818cf8;--acs:#1c2340;--on:#0b1020}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#131a2e;--fg:#e8ecf6;--mu:#94a3b8;--bd:#243049;--ac:#818cf8;--acs:#1c2340;--on:#0b1020}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem}
.lift{transition:transform .25s,border-color .25s,box-shadow .25s}
.lift:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 12px 30px -14px var(--ac)}
.chip{display:inline-block;font-size:.75rem;padding:.2rem .6rem;border-radius:999px;background:var(--acs);color:var(--ac);transition:transform .2s}
.chip:hover{transform:scale(1.08)}
.mu{color:var(--mu)} .ac{color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;border-radius:.75rem;font-weight:600;font-size:.9rem;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--ac)}
.btn-p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.pill{padding:.4rem .9rem;border-radius:999px;font-size:.85rem;font-weight:500;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;transition:.2s}
.pill:hover{color:var(--fg);border-color:var(--ac)}
.pill.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.grad{background:linear-gradient(90deg,var(--ac),#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.skill:hover .sic{transform:rotate(-8deg) scale(1.15);background:var(--ac);color:var(--on)}
.sic{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.75rem;background:var(--acs);color:var(--ac);transition:.25s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade .35s both}
.tl{border-left:2px solid var(--bd)}
.dot{position:absolute;left:-1.62rem;top:.35rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
input,textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:.6rem;padding:.6rem .8rem;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.6);display:grid;place-items:center;padding:1rem;z-index:50}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const P = {
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  github:'<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',

  code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',

  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',

  check:'<path d="M20 6 9 17l-5-5"/>',

  grad:'<path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  cpu:'<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
  db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
};
const Icon = ({ n, s = 18, c = '' }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
    strokeLinecap="round" strokeLinejoin="round" className={c} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: P[n] }} />
);

const EMAIL = 'pavithrankalaivanan07@gmail.com';
const LINKS = [
  { n: 'github', label: 'GitHub', url: 'https://github.com/Pavi-1234-msd' },
  { n: 'linkedin', label: 'LinkedIn', url: 'https://www.linkedin.com/in/pavithrank-cse/' },
  { n: 'code', label: 'LeetCode', url: 'https://leetcode.com/u/Pavithrankalaivanan/' },
  { n: 'code', label: 'HackerRank', url: 'https://www.hackerrank.com/profile/pavithrankalaiv1' },
];

const FILTERS = ['All', 'Full-Stack', 'AI/ML', 'Real-time', 'Cloud'];
const PROJECTS = [
  {
    title: 'SeriSense AI', sub: 'Sericulture Decision-Support PWA', cats: ['Full-Stack', 'AI/ML', 'Cloud'],
    stack: ['React', 'Flask', 'Firebase', 'TensorFlow Lite'], live: 'https://serisense-ai.vercel.app',
    pts: [
      'Full-stack PWA offering AI leaf assessment, stage-wise climate advisory and silkworm health assessment in five languages, deployed on Vercel and Render.',
      'MobileNetV2 classifier served through server-side TensorFlow Lite for three-class mulberry leaf assessment (98.75% validation accuracy on the augmented dataset).',
      'Flask REST API secured with Firebase ID-token verification and per-user Firestore and Storage isolation, validated by 28 passing regression tests.',
      'Rule-based risk engine that combines leaf, climate and symptom data into a 0\u2013100 priority index on a farm dashboard.',
    ],
  },
  {
    title: 'LearnLoop', sub: 'Peer-to-Peer Skill Exchange Platform', cats: ['Full-Stack', 'Real-time'],
    stack: ['Java', 'Spring Boot', 'React', 'MySQL', 'WebSocket'],
    pts: [
      'Users exchange skills for free by listing what they know and want to learn, with send, accept and reject request workflows.',
      'Real-time chat over WebSocket (SockJS + STOMP) with a unique chat room per user pair.',
      'REST APIs built with Spring Boot and Spring Data JPA, backed by a MySQL database.',
    ],
  },
  {
    title: 'PET Adoption Portal', sub: 'Full-stack adoption web app', cats: ['Full-Stack', 'Cloud'],
    stack: ['React', 'Spring Boot', 'MySQL', 'AWS'],
    pts: [
      'Web portal that lets users browse, list and adopt pets end to end.',
      'Responsive React interfaces for registration, pet listings and adoption requests.',

    ],
  },
];

const SKILLS = [
  { n: 'code', t: 'Languages', i: ['Java', 'Python', 'C++', 'JavaScript'] },
  { n: 'globe', t: 'Frameworks & Web', i: ['Spring Boot', 'Flask', 'React', 'Vite', 'Flutter', 'HTML', 'CSS', 'REST APIs', 'WebSocket'] },
  { n: 'cloud', t: 'Data & Cloud', i: ['MySQL', 'Cloud Firestore', 'Firebase Auth', 'Firebase Storage', 'AWS', 'Render', 'Vercel'] },
  { n: 'cpu', t: 'AI / ML', i: ['TensorFlow Lite', 'MobileNetV2 (CNN)', 'Image Classification'] },
  { n: 'tool', t: 'Tools', i: ['Git', 'GitHub', 'VS Code', 'Figma'] },
  { n: 'db', t: 'Core CS', i: ['Data Structures', 'OOP', 'DBMS', 'Operating Systems', 'Computer Networks'] },
];

function ProjectCard({ p }) {
  const [open, setOpen] = useState(false);
  const shown = open ? p.pts : p.pts.slice(0, 1);
  return (
    <article className="card lift p-5 flex flex-col fade">
      <div className="flex items-start justify-between gap-3">
        <div>
          <h3 className="text-lg font-bold">{p.title}</h3>
          <p className="mu text-sm">{p.sub}</p>
        </div>
        {p.live && (
          <a className="btn !py-1.5 !px-3 !text-xs" href={p.live} target="_blank" rel="noreferrer">
            Live <Icon n="ext" s={14} />
          </a>
        )}
      </div>
      <ul className="mt-3 space-y-2 text-sm mu list-disc pl-5">
        {shown.map((t, i) => <li key={i}>{t}</li>)}
      </ul>
      {p.pts.length > 1 && (
        <button className="ac text-sm font-semibold text-left mt-2" onClick={() => setOpen(!open)}>
          {open ? 'Show less' : `Show ${p.pts.length - 1} more`}
        </button>
      )}
      <div className="mt-auto pt-4 flex flex-wrap gap-2">
        {p.stack.map(s => <span key={s} className="chip">{s}</span>)}
      </div>
    </article>
  );
}

function ContactModal({ onClose }) {
  const [form, setForm] = useState({ name: '', msg: '' });
  const [copied, setCopied] = useState(false);
  const [sent, setSent] = useState(false);
  const first = useRef(null);
  useEffect(() => {
    first.current && first.current.focus();
    const k = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);
  const copy = async () => {
    try { await navigator.clipboard.writeText(EMAIL); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch (e) { setCopied(false); }
  };
  const submit = e => {
    e.preventDefault();
    if (!form.msg.trim()) return;
    const subject = encodeURIComponent('Portfolio enquiry' + (form.name ? ' from ' + form.name : ''));
    const body = encodeURIComponent(form.msg + (form.name ? '\n\n' + form.name : ''));
    window.location.href = `mailto:${EMAIL}?subject=${subject}&body=${body}`;
    setSent(true);
  };
  return (
    <div className="ov" onClick={onClose} role="dialog" aria-modal="true" aria-label="Contact">
      <div className="card w-full max-w-md p-6 fade" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-xl font-bold">Let's talk</h3>
          <button onClick={onClose} aria-label="Close" className="mu"><Icon n="x" s={20} /></button>
        </div>
        <p className="mu text-sm mb-4">Write a short note and it opens in your email app, addressed to me.</p>
        <form onSubmit={submit} className="space-y-3">
          <input ref={first} placeholder="Your name" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
          <textarea rows="4" placeholder="Your message" value={form.msg} onChange={e => setForm({ ...form, msg: e.target.value })} />
          <div className="flex flex-wrap gap-2">
            <button type="submit" className="btn btn-p"><Icon n="send" s={16} /> Open in email app</button>
            <button type="button" className="btn" onClick={copy}>
              <Icon n={copied ? 'check' : 'copy'} s={16} /> {copied ? 'Copied' : 'Copy email'}
            </button>
          </div>
          {sent && <p className="text-sm ac">Your email app should open with the message filled in.</p>}
        </form>
        <div className="mt-5 pt-4 flex flex-wrap gap-3" style={{ borderTop: '1px solid var(--bd)' }}>
          {LINKS.map(l => (
            <a key={l.label} href={l.url} target="_blank" rel="noreferrer" className="mu text-sm flex items-center gap-1.5 hover:underline">
              <Icon n={l.n} s={15} /> {l.label}
            </a>
          ))}
        </div>
      </div>
    </div>
  );
}

    <h2 className="text-3xl font-extrabold mb-8">{title}</h2>

);

  return (
    <div>

        <nav className="max-w-5xl mx-auto px-5 h-14 flex items-center justify-between">
          <a href="#top" className="font-extrabold">Pavithran<span className="ac">.</span></a>
          <div className="flex items-center gap-5 text-sm mu">
            <a className="hidden sm:inline hover:underline" href="#projects">Projects</a>
            <a className="hidden sm:inline hover:underline" href="#skills">Skills</a>
            <a className="hidden sm:inline hover:underline" href="#experience">Experience</a>
            <button className="btn btn-p !py-1.5 !px-3" onClick={() => setModal(true)}><Icon n="mail" s={15} /> Contact</button>
          </div>
        </nav>
      </header>

      <main id="top">
        <div className="max-w-5xl mx-auto px-5 pt-16 pb-6">
          <p className="ac font-semibold mb-3">Hi, I'm</p>
          <h1 className="text-5xl sm:text-6xl font-extrabold tracking-tight">Pavithran K</h1>
          <p className="text-2xl sm:text-3xl font-bold grad mt-2">Full-stack developer</p>
          <p className="mu mt-5 max-w-2xl text-lg">
            I like building software end to end, from the database to the screen a user sees. B.E. CSE student working with
            Java, Spring Boot, React, Python and Flask, with a deployed AI-assisted app among my projects.
          </p>
          <div className="mt-7 flex flex-wrap gap-3">
            <a href="#projects" className="btn btn-p">View projects</a>
            <button className="btn" onClick={() => setModal(true)}><Icon n="mail" s={16} /> Get in touch</button>
            {LINKS.slice(0, 2).map(l => (
              <a key={l.label} className="btn" href={l.url} target="_blank" rel="noreferrer" aria-label={l.label}><Icon n={l.n} s={16} /> {l.label}</a>
            ))}
          </div>
          <div className="mt-10 grid grid-cols-1 sm:grid-cols-3 gap-4">
            {[['3', 'full-stack projects'], ['Mar\u2013Jun 2025', 'full-stack internship'], ['CGPA 7.41', 'B.E. CSE, 2023\u20132027']].map(([a, b]) => (
              <div key={b} className="card lift p-4"><p className="text-xl font-extrabold">{a}</p><p className="mu text-sm">{b}</p></div>
            ))}
          </div>
        </div>

        <Sec id="projects" kicker="Work" title="Projects">
          <div className="flex flex-wrap gap-2 mb-6" role="tablist">
            {FILTERS.map(f => (
              <button key={f} className={'pill' + (filter === f ? ' on' : '')} onClick={() => setFilter(f)}>{f}</button>
            ))}
          </div>
          <div className="grid gap-5 md:grid-cols-2" key={filter}>
            {list.map(p => <ProjectCard key={p.title} p={p} />)}
          </div>
        </Sec>

        <Sec id="skills" kicker="Toolbox" title="Skills">
          <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            {SKILLS.map(s => (
              <div key={s.t} className="card lift skill p-5">
                <div className="flex items-center gap-3 mb-3">
                  <span className="sic"><Icon n={s.n} s={20} /></span>
                  <h3 className="font-bold">{s.t}</h3>
                </div>
                <div className="flex flex-wrap gap-2">{s.i.map(x => <span key={x} className="chip">{x}</span>)}</div>
              </div>
            ))}
          </div>
        </Sec>

        <Sec id="experience" kicker="Journey" title="Experience & Education">
          <div className="tl ml-3 pl-7 space-y-9">
            <div className="relative">
              <span className="dot" />
              <p className="ac text-sm font-semibold">March 2025 – June 2025</p>
              <h3 className="text-lg font-bold flex items-center gap-2"><Icon n="brief" s={18} /> Full Stack Development Intern</h3>
              <p className="mu text-sm mb-2">Nxtlogic Software Solutions, Coimbatore</p>
              <ul className="list-disc pl-5 text-sm mu space-y-1.5">
                <li>Developed cross-platform applications with Flutter, running a single codebase across Android, web and macOS.</li>
                <li>Built RESTful APIs with Spring Boot and integrated them with a MySQL database.</li>
                <li>Created responsive interfaces using React with Vite and connected them to backend APIs.</li>
                <li>Used Git for version control and collaborative development.</li>
              </ul>
            </div>
            <div className="relative">
              <span className="dot" />
              <p className="ac text-sm font-semibold">2023 – 2027</p>
              <h3 className="text-lg font-bold flex items-center gap-2"><Icon n="grad" s={18} /> B.E. Computer Science and Engineering</h3>
              <p className="mu text-sm">Sri Krishna College of Engineering and Technology, Coimbatore · CGPA 7.41</p>
              <p className="mu text-sm mt-1">Data Structures, OOP, DBMS, Operating Systems, Computer Networks</p>
            </div>
            <div className="relative">
              <span className="dot" />
              <p className="ac text-sm font-semibold">Certifications</p>
              <h3 className="text-lg font-bold flex items-center gap-2"><Icon n="book" s={18} /> Continuous learning</h3>
              <div className="flex flex-wrap gap-2 mt-2">
                {['Cisco: CCNA Introduction to Networks', 'Cisco: Apply AI \u2013 Analyze Customer Reviews', 'Infosys Springboard: Java Foundation', 'Infosys Springboard: React Web Developer', 'NPTEL: Cloud Computing'].map(c => <span key={c} className="chip">{c}</span>)}
              </div>
            </div>
          </div>
        </Sec>

        <section className="max-w-5xl mx-auto px-5 pb-16">
          <div className="card p-8 text-center">
            <h2 className="text-2xl font-extrabold">Looking for a full-stack or SDE trainee?</h2>
            <p className="mu mt-2">Open to full-stack and Graduate Engineer Trainee roles.</p>
            <button className="btn btn-p mt-5" onClick={() => setModal(true)}><Icon n="mail" s={16} /> Contact me</button>
          </div>
        </section>
      </main>

      <footer className="mu text-center text-sm pb-10">© Pavithran K</footer>
      {modal && <ContactModal onClose={() => setModal(false)} />}
    </div>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
